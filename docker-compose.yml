services:
  gallery:
    build:
      context: .
      dockerfile: Dockerfile
    image: simple-gallery:latest
    container_name: simple-gallery
    init: true
    # Run as the host user (uid 1000) so the bind-mounted ComfyUI output folder
    # is writable — the default image user (uid 1001) could only read it.
    user: "1000:1000"
    ports:
      # host:container — change the left side to run on another port
      - "4000:3000"
    environment:
      # Folder listed on start.
      GALLERY_ROOT: /data/gallery
      # Everything under /data can be browsed / managed.
      GALLERY_ALLOWED_ROOTS: /data
      GALLERY_DB_PATH: /data/gallery.db
      GALLERY_CACHE_DIR: /data/thumbs
      # Set to "1" to hide delete actions.
      GALLERY_READ_ONLY: "0"
    volumes:
      # SQLite database + thumbnail cache (host dir, owned by uid 1000).
      - ./data:/data
      # Library image folder — ComfyUI generation output.
      # Use :ro instead of no suffix to browse without allowing deletes.
      - /home/toanvq/ComfyUI/output:/data/gallery
      # Additional library folder, browsable under /data.
      - /home/toanvq/comfy-test/output:/data/comfy-test/output
    security_opt:
      - no-new-privileges:true
